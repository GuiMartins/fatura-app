name: Release

# Runs whenever main advances (i.e. a release/* or hotfix/* PR just merged).
# main only moves via those PRs and is protected with required status
# checks, so by the time a commit lands here it has already passed CI -
# this workflow doesn't re-gate on that, it just versions and ships it.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Semantic version bump from Conventional Commits in the new
      # commit(s) on main: `feat:` -> minor, `fix:` -> patch, `BREAKING
      # CHANGE` (anywhere in the body) -> major. No recognized prefix
      # falls back to default_bump (patch) - see CLAUDE.md for the PR
      # title convention this depends on. No initial_version input on
      # this action version - v1.0.0 already exists as the first tag.
      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Decode the release keystore from its GitHub Secret into a temp file
      # for this run only - never written to the repo, never logged. See
      # CLAUDE.md "Release assinada" for how this secret was generated and
      # how to rotate it.
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # Signed + minified (R8) build - see app/build.gradle.kts (signingConfigs
      # only activates when RELEASE_STORE_FILE is set) and
      # app/proguard-rules.pro (keep rules for javax.mail/Tink, confirmed live
      # that neither breaks under R8 - see CLAUDE.md).
      - name: Build release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Delete decoded keystore
        if: always()
        run: rm -f release.jks

      # Gradle's own output name (app-release.apk) doesn't say what app or
      # version this is - rename before uploading so the release asset is
      # self-describing.
      - name: Rename APK for the release asset
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/casshole-${{ steps.tag_version.outputs.new_tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: dist/casshole-${{ steps.tag_version.outputs.new_tag }}.apk
