name: Release

# Runs whenever main advances (i.e. a release/* or hotfix/* PR just merged).
# main only moves via those PRs and is protected with required status
# checks, so by the time a commit lands here it has already passed CI -
# this workflow doesn't re-gate on that, it just versions and ships it.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Semantic version bump from Conventional Commits in the new
      # commit(s) on main: `feat:` -> minor, `fix:` -> patch, `BREAKING
      # CHANGE` (anywhere in the body) -> major. No recognized prefix
      # falls back to default_bump (patch) - see CLAUDE.md for the PR
      # title convention this depends on. No initial_version input on
      # this action version - v1.0.0 already exists as the first tag.
      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Debug-signed build, same as every other build in this project -
      # there's no release keystore/signing config set up (see CLAUDE.md).
      # Side-load only, not Play Store material.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # Gradle's own output name (app-debug.apk) doesn't say what app or
      # version this is - rename before uploading so the release asset is
      # self-describing. Keeping "-debug" in the name since it genuinely is
      # a debug build (see above), not pretending otherwise.
      - name: Rename APK for the release asset
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/money-hole-${{ steps.tag_version.outputs.new_tag }}-debug.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: dist/money-hole-${{ steps.tag_version.outputs.new_tag }}-debug.apk
