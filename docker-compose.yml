services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://fatura:${DB_PASSWORD:-fatura}@db:5432/fatura
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fatura
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fatura}
      POSTGRES_DB: fatura
    volumes:
      - fatura_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatura"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fatura_db_data:
